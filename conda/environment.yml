# Build environment for Arachne's C++/CUDA control plane, targeting NVIDIA
# Blackwell GPUs (SM100 data-center: B100/B200/GB200; SM120 consumer:
# RTX 50-series / GeForce Blackwell). CUDA 12.8+ is required for Blackwell
# device code generation.
#
# Usage:
#   conda env create -f conda/arachne-blackwell.yml
#   conda activate arachne-blackwell
#   cmake -S cpp -B cpp/build -GNinja
#   cmake --build cpp/build
name: arachne
channels:
  - rapidsai
  - conda-forge
  - nvidia
dependencies:
  - python=3.14
  - cuda-version=12.8
  - cuda-toolkit=12.8
  - cuda-nvcc=12.8
  - cuda-cudart=12.8
  - cuda-cudart-dev=12.8
  - gcc=12
  - gxx=12
  - cmake>=3.26
  - ninja
  - libraft-headers       # RAFT: header-only + compiled GPU primitives (distance, matrix, etc.)
  - libraft
  - librmm
  - gtest
  - spdlog                # Logging.
  - highway               # CPU SIMD (AVX2/AVX512/NEON) dynamic dispatch for arachne/util vector math.
