; SIFT1B streaming workload -- "search-heavy" insert:search rate (1:4).
;
; See sift1b_streaming_balanced.ini for the full explanation of this
; three-way ratio-variant setup; this file only differs in [pools]
; num_insert/num_search/num_delete and [output] output_root.

[dataset]
source_format = xbin
dim = 128
dtype = uint8
source_dataset_path = /data2/sukjoon/datasets/SIFT1B/base.1B.u8bin
eval_query_dataset_path = /data2/sukjoon/datasets/SIFT1B/query.public.10K.u8bin

[clustering]
num_clusters = 64
cluster_sample_size = 200000

[pools]
num_base = 10000000
; search-heavy: 1:4 insert:search rate (mostly SEARCH traffic)
num_insert = 1000000
num_search = 4000000
num_delete = 1000000
segment_locality = align

[streaming]
workload_kind = insert_delete_search
num_steps = 100
checkpoint_every = 10

[groundtruth]
k = 100
metric = euclidean
device = gpu

[output]
format = xbin
output_root = scripts/workload/sift1b/workload_c
random_seed = 42
num_sets = 1
