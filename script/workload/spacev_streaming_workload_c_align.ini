; SIFT1B streaming workload -- "balanced" insert:search rate (1:1).
;
; One of three ratio variants (balanced / search_heavy / insert_heavy) that
; differ *only* in [pools] num_insert/num_search/num_delete -- the same
; idea as YCSB's read/write-ratio workload variants (A/B/C/...), applied to
; arachne's insert:search rate instead of a DB's read/write rate. See
; ../../generate_sift1b_workloads.sh, which runs all three.
;
; SIFT1B itself (base.1B.u8bin: 1e9 x 128 uint8, ~128GB) is never modified
; by this tool -- pool_sizes below carve out a fixed-size slice to read
; from it; everything generated is written under [output] output_root
; instead (see scripts/README.md).

[dataset]
source_format = xbin
dim = 100
dtype = int8
source_dataset_path = /data2/sukjoon/datasets/SPACEV1B/vectors.i8bin
eval_query_dataset_path = /data2/sukjoon/datasets/SPACEV1B/query.bin

[clustering]
; 64 k-means clusters, matching SVFusion's own "Clustered" workload
; definition (SVFusion.pdf sec 6.1 / 2023 Big ANN Challenge)
num_clusters = 64
cluster_sample_size = 200000

[pools]
num_base = 10000000
; search-heavy: 1:4 insert:search rate (mostly SEARCH traffic)
num_insert = 1000000
num_search = 4000000
num_delete = 1000000
; align | nonalign | random -- see python/arachne/README.md "Segment locality"
segment_locality = align

[streaming]
workload_kind = insert_delete_search
num_steps = 100
; one groundtruth checkpoint every 10 steps (10 total) -- raise/lower to
; trade checkpoint resolution against exhaustive-scan recomputation cost
checkpoint_every = 10

[groundtruth]
k = 100
metric = euclidean
device = gpu

[output]
format = xbin
output_root = scripts/workload/spacev1b/workload_c
random_seed = 42
num_sets = 1
