[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arachne"
version = "0.0.1"
description = "Python-side workload generation / benchmark orchestration / analysis tooling for the arachne project"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-learn",
    "pandas",
    "matplotlib",
    "pyyaml",
]

[project.optional-dependencies]
# GroundTruthComputer(device=ComputeDevice.GPU) -- pick the cupy build matching
# your installed CUDA toolkit (this project targets CUDA 12.8).
gpu = ["cupy-cuda12x"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arachne*"]
