; Example config for the insert(+delete)+search StreamingWorkloadOrganizer.
; Copy this file, edit the paths/values below, then run:
;   PYTHONPATH=python python3 python/arachne/workload/example/generate_streaming_workload.py --config /path/to/your.ini

[dataset]
source_format = xbin
dim = 128
dtype = uint8
source_dataset_path = /path/to/base.1B.u8bin
; a separate, already-final query set used purely to grade ground truth at
; every checkpoint -- NOT cut from source_dataset_path
eval_query_dataset_path = /path/to/query.public.10K.u8bin

[clustering]
num_clusters = 64
cluster_sample_size = 200000

[pools]
; num_base + num_insert + num_search must not exceed the source dataset's
; row count (checked immediately, before clustering); any remainder is
; simply left unused.
num_base = 1000000
; total insert-pool rows across the whole run -- num_steps below divides
; this into that many near-equal per-step segments (no separate per-step
; size to keep in sync with it)
num_insert = 1000000
; total search-pool (stream query) rows across the whole run, likewise
; divided into num_steps segments -- the insert:search rate is just
; whatever ratio num_insert:num_search is chosen in (here, 2:1)
num_search = 500000
; total rows deleted over the whole run, divided into num_steps per-step
; batches the same way -- each batch is chosen *uniformly at random* from
; whatever is active at that point (base rows and every not-yet-deleted
; inserted row alike), not a FIFO/oldest-first rule. Blank -> 0 (no
; deletes -- required for workload_kind = insert_search below).
num_delete = 500000
; align    -> insert and search both cluster-ordered, same cluster sequence
;             (step i's insert and search segments tend to share a cluster
;             -- high locality, both drift together)
; nonalign -> insert stays cluster-ordered; search is also cluster-ordered
;             (still has real per-segment locality) but in an independently
;             shuffled cluster sequence -- drifts on both sides, just not
;             in sync with each other
; random   -> both shuffled uniformly, ignoring cluster structure entirely
;             (no drift, no per-segment locality on either side -- baseline)
segment_locality = align

[streaming]
; insert_search (pure growth, num_delete must be 0) | insert_delete_search
; (each step also deletes its share of num_delete, chosen randomly)
workload_kind = insert_delete_search
; the "iteration set" size: how many discrete insert(+delete) steps this
; run has -- also how many pieces num_insert/num_search/num_delete above
; each get divided into
num_steps = 200
; 1 = a groundtruth checkpoint at every step
checkpoint_every = 1

[groundtruth]
k = 100
metric = euclidean
device = gpu

[output]
format = xbin
output_root = /path/to/output
random_seed = 42
num_sets = 2
