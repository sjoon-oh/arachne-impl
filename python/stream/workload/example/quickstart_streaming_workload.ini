; Simple, immediately-runnable example for the streaming
; StreamingWorkloadOrganizer, using the same synthetic dataset either
; example script's demo mode writes to disk (no real dataset needed).
;
; 1) First, generate the synthetic files this ini points at (run once,
;    either script's no-argument demo mode works -- they write the same
;    files):
;      PYTHONPATH=python python3 python/arachne/workload/example/generate_streaming_workload.py
;
; 2) Then run this ini (from the repository root, same as step 1):
;      PYTHONPATH=python python3 python/arachne/workload/example/generate_streaming_workload.py --config python/arachne/workload/example/quickstart_streaming_workload.ini
;
; See streaming_workload.example.ini for a fully annotated template meant
; to be copied and pointed at a real dataset instead.

[dataset]
source_format = xbin
dim = 32
dtype = uint8
source_dataset_path = python/arachne/workload/example/output/synthetic_source.u8bin
eval_query_dataset_path = python/arachne/workload/example/output/synthetic_eval_queries.u8bin

[clustering]
num_clusters = 16
cluster_sample_size = 10000

[pools]
num_base = 20000
; total insert-pool rows across the whole run -- divided into num_steps
; near-equal per-step segments below
num_insert = 10000
; total search-pool rows across the whole run, likewise divided -- a 2:1
; insert:search rate
num_search = 5000
; total rows deleted over the run, divided into num_steps per-step
; batches, each chosen uniformly at random from whatever is active at
; that point. Blank -> 0 (required for workload_kind = insert_search).
num_delete = 5000
; align | nonalign | random -- see streaming_workload.example.ini for what each means
segment_locality = align

[streaming]
workload_kind = insert_delete_search
num_steps = 20
checkpoint_every = 1

[groundtruth]
k = 10
metric = euclidean
device = cpu

[output]
format = xbin
output_root = python/arachne/workload/example/output/quickstart_ini_streaming_runs
random_seed = 42
num_sets = 1
